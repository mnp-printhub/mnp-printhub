<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNP PrintHub - Loharu • Smart Cyber Cafe Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- HEADER -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 text-white font-bold text-xl px-3 py-1 rounded-lg">MNP</div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-none">MNP PrintHub</h1>
                    <span class="text-xs text-blue-600 font-medium">Loharu • Smart Digital Hub</span>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md hidden md:block relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="filterTools()" 
                    placeholder="Search AI crop, passport photo, PDF, forms..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-slate-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <div class="flex items-center space-x-3">
                <span class="text-xs bg-emerald-100 text-emerald-700 font-bold px-3 py-1.5 rounded-full">🟢 API BG Studio Active</span>
            </div>
        </div>
    </header>

    <!-- HERO BANNER -->
    <section class="max-w-7xl mx-auto px-4 my-4">
        <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 rounded-2xl p-6 text-white text-center shadow-lg">
            <h2 class="text-xl md:text-3xl font-extrabold mb-2">MNP PrintHub - Smart Print & Cyber Cafe Tools</h2>
            <p class="text-xs md:text-sm text-blue-100 max-w-2xl mx-auto">In-Site API Background Removal, A4 Passport Grid Layouts & PDF Tools.</p>
        </div>
    </section>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 space-y-8 pb-12">

        <!-- 1. ESSENTIAL & SERVICES -->
        <section>
            <div class="flex items-center space-x-2 border-l-4 border-blue-600 pl-3 mb-4">
                <h3 class="font-bold text-slate-800 text-base md:text-lg">Essential & Print Tools</h3>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 tool-grid">
                
                <button type="button" onclick="openEngine('ai-crop', 'AI Document Crop')" class="tool-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition text-center relative group w-full">
                    <span class="absolute top-2 right-2 bg-purple-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">AI</span>
                    <i class="fa-solid fa-crop-simple text-2xl text-purple-500 mb-2 group-hover:scale-110 transition block"></i>
                    <p class="text-xs font-semibold text-slate-700">AI Document Crop</p>
                </button>

                <button type="button" onclick="openEngine('passport', 'Passport Size Photo')" class="tool-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition text-center relative group w-full">
                    <i class="fa-solid fa-user-gear text-2xl text-orange-500 mb-2 group-hover:scale-110 transition block"></i>
                    <p class="text-xs font-semibold text-slate-700">Passport Photo</p>
                </button>

                <button type="button" onclick="openEngine('crop-resize', 'Photo Crop & Resize')" class="tool-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition text-center relative group w-full">
                    <i class="fa-solid fa-expand text-2xl text-blue-400 mb-2 group-hover:scale-110 transition block"></i>
                    <p class="text-xs font-semibold text-slate-700">Photo Crop & Resize</p>
                </button>

            </div>
        </section>

        <!-- 2. PHOTO PRINT TOOLS -->
        <section>
            <div class="flex items-center space-x-2 border-l-4 border-purple-600 pl-3 mb-4">
                <h3 class="font-bold text-slate-800 text-base md:text-lg">Photo Print Tools</h3>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 tool-grid">
                
                <button type="button" onclick="openEngine('remove-bg', 'In-Site API Background Studio')" class="tool-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition text-center relative group w-full">
                    <span class="absolute top-2 right-2 bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">API AI</span>
                    <i class="fa-solid fa-scissors text-2xl text-rose-500 mb-2 group-hover:scale-110 transition block"></i>
                    <p class="text-xs font-semibold text-slate-700">Remove BG</p>
                </button>

                <button type="button" onclick="openEngine('a4-print', 'A4 Photo Print Layout')" class="tool-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition text-center relative group w-full">
                    <i class="fa-solid fa-print text-2xl text-blue-500 mb-2 group-hover:scale-110 transition block"></i>
                    <p class="text-xs font-semibold text-slate-700">A4 Photo Print</p>
                </button>

            </div>
        </section>

        <!-- 3. SMART PDF TOOLS -->
        <section>
            <div class="flex items-center space-x-2 border-l-4 border-emerald-600 pl-3 mb-4">
                <h3 class="font-bold text-slate-800 text-base md:text-lg">Smart PDF Tools</h3>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 tool-grid">
                
                <button type="button" onclick="openEngine('jpg-to-pdf', 'JPG to PDF Converter')" class="tool-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition text-center relative group w-full">
                    <i class="fa-solid fa-file-pdf text-2xl text-red-500 mb-2 group-hover:scale-110 transition block"></i>
                    <p class="text-xs font-semibold text-slate-700">JPG To PDF</p>
                </button>

                <button type="button" onclick="openEngine('pdf-to-jpg', 'PDF to JPG Converter')" class="tool-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer transition text-center relative group w-full">
                    <i class="fa-solid fa-file-image text-2xl text-orange-500 mb-2
